<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container, .preview-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], textarea, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group label { display: inline; font-weight: normal; margin-right: 15px; }
        
        /* Styling for the HTML5 validation errors */
        input:invalid, textarea:invalid, select:invalid { border-color: #e74c3c; }
        input:valid, textarea:valid, select:valid { border-color: #2ecc71; }
        
        button {
            padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;
        }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-preview { background-color: #3498db; color: white; }
        .btn-submit { background-color: #2ecc71; color: white; }
        
        .preview-container { display: none; border-left: 5px solid #3498db; }
        
        /* Status feedback box */
        #statusMessage {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Contact Dr. Emmy</h2>
        <p>My fictional address</p>
        <p>+2348146354227</p>
        <p>peteremmanuelomeiza12@gmail.com</p>
        <hr size="2" noshade="" color="pink">
        <p class="description">
            Please complete the form below to contact Dr. Emmy.
        </p>

        <form id="contactForm">
            <!-- Hidden Access Key for Web3Forms -->
            <!-- Step 1: Go to https://web3forms.com to get your free key sent to peteremmanuelomeiza12@gmail.com -->
            <!-- Step 2: Paste your access key in the value attribute below -->
            <input type="hidden" name="access_key" value="15ae6d68-3dd9-449a-a6a9-56730d5e2fba">
            
            <div class="form-group">
                <label for="userName">Full Name:</label>
                <input type="text" id="userName" name="userName" required>
            </div>

            <div class="form-group">
                <label for="userEmail">Email Address:</label>
                <input type="email" id="userEmail" name="userEmail" required title="Please enter a valid email address.">
            </div>

            <div class="form-group">
                <label for="userPhone">Phone Number:</label>
                <!-- Accepts optional '+' followed by 10 to 14 digits (e.g. +2348146354227 or 08146354227) -->
                <input type="tel" id="userPhone" name="userPhone" pattern="^\+?[0-9]{10,14}$" required 
                       title="Please enter a valid phone number (10 to 14 digits, optional leading '+').">
            </div>

            <div class="form-group">
                <label>Preferred Contact Method:</label>
                <div class="radio-group">
                    <input type="radio" id="contactEmail" name="contactMethod" value="Email" required>
                    <label for="contactEmail">Email</label>
                    <input type="radio" id="contactPhone" name="contactMethod" value="Phone">
                    <label for="contactPhone">Phone</label>
                    <input type="radio" id="contactBoth" name="contactMethod" value="Both">
                    <label for="contactBoth">Both</label>
                </div>
            </div>

            <div class="form-group">
                <label for="inquiryType">Inquiry Type:</label>
                <select id="inquiryType" name="inquiryType" required>
                    <option value="">--Select an Option--</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Support Request">Support Request</option>
                    <option value="Feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userMessage">Message:</label>
                <textarea id="userMessage" name="userMessage" rows="4" required></textarea>
            </div>

            <!-- Preview button handles client-side instant preview -->
            <button type="button" class="btn-preview" id="previewBtn">Preview</button>
            <button type="submit" class="btn-submit" id="submitBtn">Submit</button>

            <!-- Status message container -->
            <div id="statusMessage"></div>
        </form>
    </div>

    <!-- Live Preview Container -->
    <div class="preview-container" id="previewArea">
        <h3>Form Preview</h3>
        <p><strong>Name:</strong> <span id="prevName"></span></p>
        <p><strong>Email:</strong> <span id="prevEmail"></span></p>
        <p><strong>Phone:</strong> <span id="prevPhone"></span></p>
        <p><strong>Contact Method:</strong> <span id="prevMethod"></span></p>
        <p><strong>Inquiry Type:</strong> <span id="prevInquiry"></span></p>
        <p><strong>Message:</strong> <span id="prevMessage"></span></p>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const previewBtn = document.getElementById('previewBtn');
        const previewArea = document.getElementById('previewArea');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // 1. Instant Preview logic without page refresh
        previewBtn.addEventListener('click', () => {
            const selectedMethod = document.querySelector('input[name="contactMethod"]:checked');
            
            document.getElementById('prevName').textContent = document.getElementById('userName').value || '(Not entered)';
            document.getElementById('prevEmail').textContent = document.getElementById('userEmail').value || '(Not entered)';
            document.getElementById('prevPhone').textContent = document.getElementById('userPhone').value || '(Not entered)';
            document.getElementById('prevMethod').textContent = selectedMethod ? selectedMethod.value : '(Not selected)';
            document.getElementById('prevInquiry').textContent = document.getElementById('inquiryType').value || '(Not selected)';
            document.getElementById('prevMessage').textContent = document.getElementById('userMessage').value || '(Not entered)';

            previewArea.style.display = 'block';
            previewArea.scrollIntoView({ behavior: 'smooth' });
        });

        // 2. Background Email Submission using Fetch API
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Check HTML5 validity
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Update button UI while sending
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusMessage.style.display = 'none';
            statusMessage.className = '';

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                });

                const result = await response.json();

                if (response.status === 200) {
                    statusMessage.className = 'status-success';
                    statusMessage.textContent = 'Thank you! Your message has been sent successfully.';
                    statusMessage.style.display = 'block';
                    form.reset();
                    previewArea.style.display = 'none';
                } else {
                    throw new Error(result.message || 'Something went wrong.');
                }
            } catch (error) {
                statusMessage.className = 'status-error';
                statusMessage.textContent = 'Oops! ' + error.message;
                statusMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });
    </script>
</body>
</html>
